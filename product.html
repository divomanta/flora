<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детайли | Флора</title>
    <meta name="description" content="Цветарски магазин Флора в гр. Тутракан. Свежи букети, венци и сватбена флористика.">
    <meta name="keywords" content="цветя, букети, Тутракан, цветарски магазин, доставка на цветя, рози, орхидеи">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-detail-container {
            display: flex;
            flex-wrap: wrap;
            gap: 3rem;
            background: var(--bg-light-green);
            padding: 3rem;
            border-radius: 8px;
            margin-top: 2rem;
        }
        .product-image { 
            flex: 1; 
            min-width: 300px; 
        }
        .product-image img { 
            width: 100%; 
            border-radius: 8px; 
            object-fit: cover; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .product-info { 
            flex: 1; 
            min-width: 300px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        .product-info h1 { 
            font-size: 2.5rem; 
            margin-bottom: 0.5rem; 
        }
        .product-info .category-tag {
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 1.5rem;
        }
        .product-info .price { 
            font-size: 2rem; 
            margin-bottom: 1.5rem; 
        }
        .product-info p.desc { 
            font-size: 1.1rem; 
            margin-bottom: 2rem; 
            line-height: 1.8;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Флора <i class="fa-solid fa-leaf"></i></a>
        <nav>
            <ul id="nav-menu">
                <li><a href="index.html">Начало</a></li>
                <li><a href="catalog.html">Каталог</a></li>
                <li><a href="order.html">Поръчай</a></li>
                <li><a href="contact.html">Контакти</a></li>
            </ul>
        </nav>
        <div class="burger" id="burger-menu"><i class="fa-solid fa-bars"></i></div>
    </header>

    <main>
        <section>
            <a href="catalog.html" class="back-link fade-in"><i class="fa-solid fa-arrow-left"></i> Обратно към каталога</a>
            
            <div id="single-product" class="product-detail-container fade-in">
                <p>Зареждане на продукта...</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-grid">
            <div>
                <a href="index.html" class="logo" style="color: var(--bg-white);">Флора</a>
                <p style="margin-top: 1rem;">Красота от природата.</p>
            </div>
            <div>
                <h3>Контакти</h3>
                <p>ул. Родина 18, гр. Тутракан</p>
                <p>0887 865 181</p>
                <p>ivi_indjeva@abv.bg</p>
            </div>
            <div>
                <h3>Последвайте ни</h3>
                <div style="margin-top: 1rem;">
                    <a href="#" style="color: var(--bg-white); font-size: 1.5rem; margin-right: 1rem;"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#" style="color: var(--bg-white); font-size: 1.5rem;"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 ЕТ РАИВ-2012 ИВЕЛИНА ИНДЖЕВА (Магазин „Флора“). Всички права запазени.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/product.js"></script>
</body>
</html>
