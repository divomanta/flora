<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог | Флора</title>
    <meta name="description" content="Цветарски магазин Флора в гр. Тутракан. Свежи букети, венци и сватбена флористика.">
    <meta name="keywords" content="цветя, букети, Тутракан, цветарски магазин, доставка на цветя, рози, орхидеи">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .filters { text-align: center; margin-bottom: 2rem; }
        .filter-btn { 
            background: none; 
            border: 2px solid var(--primary-color); 
            padding: 0.5rem 1rem; 
            margin: 0.2rem; 
            cursor: pointer; 
            border-radius: 20px; 
            color: var(--primary-color); 
            font-weight: 600; 
            transition: all 0.3s;
        }
        .filter-btn.active, .filter-btn:hover { 
            background: var(--primary-color); 
            color: var(--bg-white); 
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Флора <i class="fa-solid fa-leaf"></i></a>
        <nav>
            <ul id="nav-menu">
                <li><a href="index.html">Начало</a></li>
                <li><a href="catalog.html">Каталог</a></li>
                <li><a href="order.html">Поръчай</a></li>
                <li><a href="contact.html">Контакти</a></li>
            </ul>
        </nav>
        <div class="burger" id="burger-menu"><i class="fa-solid fa-bars"></i></div>
    </header>

    <main>
        <section>
            <h1 class="section-title fade-in">Нашият Каталог</h1>
            
            <div class="filters fade-in">
                <button class="filter-btn active" data-filter="всички">Всички</button>
                <button class="filter-btn" data-filter="букети">Букети</button>
                <button class="filter-btn" data-filter="венци">Венци</button>
                <button class="filter-btn" data-filter="сватбена флористика">Сватбени</button>
                <button class="filter-btn" data-filter="аранжировки">Аранжировки</button>
                <button class="filter-btn" data-filter="подаръци">Подаръци</button>
                <button class="filter-btn" data-filter="саксийни">Саксийни</button>
            </div>

            <div class="grid-3" id="product-list">
                </div>
        </section>
    </main>

    <footer>
        <div class="footer-grid">
            <div>
                <a href="index.html" class="logo" style="color: var(--bg-white);">Флора</a>
                <p style="margin-top: 1rem;">Красота от природата.</p>
            </div>
            <div>
                <h3>Контакти</h3>
                <p>ул. Родина 18, гр. Тутракан</p>
                <p>0887 865 181</p>
                <p>ivi_indjeva@abv.bg</p>
            </div>
            <div>
                <h3>Последвайте ни</h3>
                <div style="margin-top: 1rem;">
                    <a href="#" style="color: var(--bg-white); font-size: 1.5rem; margin-right: 1rem;"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#" style="color: var(--bg-white); font-size: 1.5rem;"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 ЕТ РАИВ-2012 ИВЕЛИНА ИНДЖЕВА (Магазин „Флора“). Всички права запазени.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/catalog.js"></script>
</body>
</html>
